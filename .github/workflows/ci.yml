name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test the site scripts and contracts
        run: |
          python -m pip install pytest pyyaml
          python -m pytest -q tests

      # The deploy copies main's site/ to /prerelease/ with these rewrites, and
      # falls back to a redirect when one matches nothing. Fail here instead,
      # while the copy that broke it is still in review.
      - name: Build the release-candidate mirror from this checkout
        run: |
          cp -r site "$RUNNER_TEMP/_site"
          python scripts/build_prerelease_site.py build \
            --site-dir "$RUNNER_TEMP/_site" --rc-website site --tag v0.0.0rc1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: telemetry-worker/package-lock.json

      - name: Install telemetry Worker dependencies
        working-directory: telemetry-worker
        run: npm ci

      - name: Test telemetry Worker
        working-directory: telemetry-worker
        run: npm test

      - name: Validate telemetry Worker config and D1 binding
        working-directory: telemetry-worker
        run: npm run check:config
